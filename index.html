<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EarthVisited — mark the countries you have visited</title>
<meta name="description" content="Click the countries you have been to, see how much of the world you have covered, and download your map as an image.">
<meta name="color-scheme" content="dark light">
<meta property="og:type" content="website">
<meta property="og:title" content="EarthVisited">
<meta property="og:description" content="Mark the countries you have visited and download your world map.">
<meta property="og:url" content="https://recepyazar.github.io/earth_visited/">
<meta property="og:image" content="https://recepyazar.github.io/earth_visited/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="EarthVisited">
<meta name="twitter:description" content="Mark the countries you have visited and download your world map.">
<meta name="twitter:image" content="https://recepyazar.github.io/earth_visited/og.png">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/style.css?v=12">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="15" cy="15" r="11.6"/>
        <ellipse cx="15" cy="15" rx="5.4" ry="11.6" stroke-width="1.5"/>
        <path d="M4.2 11h21.6M4.2 19h21.6" stroke-width="1.5"/>
      </g>
      <circle cx="24" cy="24" r="8.4" fill="var(--bg-2)"/>
      <circle cx="24" cy="24" r="6.6" fill="var(--accent)"/>
      <path d="m20.9 24.2 2.2 2.2 4.1-4.7" fill="none" stroke="var(--bg-2)" stroke-width="2.1"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Earth<span>Visited</span></h1>
  </div>
  <div class="topbar-actions">
    <button id="settingsBtn" class="chip wide" type="button" data-i18n-title="settings">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9.1A1.7 1.7 0 0 0 10.13 3V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1.03Z"/>
      </svg>
      <span data-i18n="settings">Settings</span>
    </button>
  </div>
</header>

<main>
  <section class="stage">
    <div class="mapwrap" id="mapwrap">
      <svg id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="World map"></svg>
      <canvas id="globe" hidden></canvas>
      <div class="viewswitch">
        <button id="viewMap" class="vbtn on" type="button" data-i18n-title="viewMap" aria-label="Map">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9"
               stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6.5v13L9 17l6 3 6-2.5v-13L15 7 9 4Z"/><path d="M9 4v13M15 7v13"/></svg>
        </button>
        <button id="viewCities" class="vbtn" type="button" data-i18n-title="viewCities" aria-label="Cities">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9"
               stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s6.5-5.6 6.5-10.4A6.5 6.5 0 0 0 5.5 10.6C5.5 15.4 12 21 12 21Z"/><circle cx="12" cy="10.4" r="2.4"/></svg>
        </button>
        <button id="viewGlobe" class="vbtn" type="button" data-i18n-title="viewGlobe" aria-label="Globe">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9"
               stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"/><ellipse cx="12" cy="12" rx="4" ry="8.6"/><path d="M3.6 9.2h16.8M3.6 14.8h16.8"/></svg>
        </button>
      </div>
      <div class="zoomctl">
        <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
        <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
        <button id="zoomReset" type="button" aria-label="Reset view">⤾</button>
      </div>
      <div class="crumbs" id="crumbs" hidden>
        <button id="crumbBack" class="crumb-back" type="button">‹ <span data-i18n="world">World</span></button>
        <b id="crumbName"></b>
        <span id="crumbCount"></span>
      </div>
      <div class="hint" id="hint" data-i18n="hint"></div>
      <div class="flash" id="flash" hidden aria-live="polite"></div>
      <div class="tip" id="tip" hidden></div>
    </div>
  </section>

  <aside class="panel">
    <div class="score">
      <div class="score-main">
        <span class="count" id="count">0</span>
        <span class="of" id="total">/ 195</span>
        <span class="pct" id="pct">0%</span>
      </div>
      <div class="bar"><i id="barfill"></i></div>
      <p class="score-sub" id="scoreSub"><span data-i18n="countries">countries visited</span> · <span id="terr">0</span> <span data-i18n="territories">territories</span></p>

    </div>

    <div class="panel-body">
      <div class="tiles">
        <div class="tile">
          <b data-i18n="land">Land area</b>
          <strong id="landPct">0%</strong>
          <i class="tilebar"><span id="landBar"></span></i>
          <small id="landAbs"></small>
        </div>
        <div class="tile">
          <b data-i18n="people">Population</b>
          <strong id="popPct">0%</strong>
          <i class="tilebar"><span id="popBar"></span></i>
          <small id="popAbs"></small>
        </div>
      </div>

      <div class="block">
        <div class="caption" data-i18n="markAs">Mark as</div>
        <div class="brush" id="brush" role="group"></div>
      </div>

      <div class="divider"></div>

      <div class="block" id="regionBlock">
        <div class="caption" data-i18n="continents">Filter by continent</div>
        <div class="regions" id="regions"></div>
      </div>

      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="search" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="search" placeholder="Search a country…">
      </div>

      <div class="list" id="list" role="group" aria-label="Countries"></div>
    </div>

    <div class="panel-actions">
      <button id="resetBtn" class="btn" type="button" data-i18n="reset">Reset</button>
      <button id="shareBtn" class="btn primary" type="button" data-i18n="shareOpen">Share</button>
    </div>
  </aside>
</main>

<dialog id="settings" class="sheet" aria-labelledby="settingsTitle">
  <div class="sheet-head">
    <h2 id="settingsTitle" data-i18n="settings">Settings</h2>
    <button id="settingsClose" class="chip" type="button" data-i18n-title="close">✕</button>
  </div>

  <div class="block">
    <div class="caption" data-i18n="language">Language</div>
    <div class="opts" id="langOpts" role="group"></div>
  </div>

  <div class="block">
    <div class="caption" data-i18n="appearance">Appearance</div>
    <div class="opts" id="themeOpts" role="group"></div>
  </div>

  <div class="block">
    <div class="caption" data-i18n="colors">Marker colours</div>
    <div class="colorlist" id="colorList"></div>
    <button id="resetColors" class="btn subtle" type="button" data-i18n="resetColors">Reset to defaults</button>
  </div>
</dialog>

<dialog id="sheet" class="sheet" aria-labelledby="sheetTitle">
  <div class="sheet-head">
    <h2 id="sheetTitle" data-i18n="shareTitle">Share your map</h2>
    <button id="sheetClose" class="chip" type="button" aria-label="Close">✕</button>
  </div>

  <div class="sizes" id="sizes" role="group"></div>

  <div class="preview"><img id="cardImg" alt=""></div>

  <div class="sheet-actions">
    <button id="sysShare" class="btn primary" type="button" hidden data-i18n="shareImage">Share image</button>
    <button id="saveImg" class="btn" type="button" data-i18n="saveImage">Save image</button>
    <button id="copyImg" class="btn" type="button" data-i18n="copyImage">Copy image</button>
    <button id="copyLink" class="btn" type="button" data-i18n="share">Copy link</button>
  </div>

  <p class="sheet-note" data-i18n="shareNote"></p>
</dialog>

<div class="toast" id="toast" hidden></div>

<script src="js/i18n.js?v=12"></script>
<script src="js/admin1/index.js?v=12"></script>
<script src="js/share.js?v=12"></script>
<script src="js/data.js?v=12"></script>
<script src="js/card.js?v=12"></script>
<script src="js/app.js?v=12"></script>
</body>
</html>
